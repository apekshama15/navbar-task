<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Navbar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="demo">
        <h2>LinkedIn Navbar</h2>
        <nav class="bar linkedin" aria-label="LinkedIn-style navbar">
            <div class="in-logo">in</div>
            <div class="search"><strong>⌕</strong><span>Search</span></div>
            <div class="li-links">
                <div class="li-item active"><span class="li-icon">◆</span>Home</div>
                <div class="li-item"><span class="li-icon">♟</span><span class="badge">5</span>My Network</div>
                <div class="li-item"><span class="li-icon">▣</span>Jobs</div>
                <div class="li-item"><span class="li-icon">●</span>Messaging</div>
                <div class="li-item"><span class="li-icon">♟</span><span class="badge">25</span>Notifications</div>
                <div class="li-item"><span class="li-icon">◉</span>Me⌄</div>
                <div class="li-item"><span class="li-icon">▦</span>For Business⌄</div>
                <div class="li-item"><span class="li-icon" style="color:#c88925">▰</span>Try Premium for ₹0</div>
            </div>
        </nav>
    </main>
</body>

</html>
