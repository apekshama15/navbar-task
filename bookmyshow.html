<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyShow Navbar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="demo">
        <h2>BookMyShow Navbar</h2>
        <nav class="bar" aria-label="BookMyShow-style navbar">
            <div class="bms-top">
                <div class="bms-logo">book<span>my</span>show</div>
                <div class="bms-search">⌕ <span>Search for Movies, Events, Plays, Sports and Activities</span></div>
                <div class="bms-city">Pune ⌄</div>
                <div class="signin">Sign in</div>
                <div class="hamburger">≡</div>
            </div>
            <div class="bms-bottom">
                <span>Movies</span><span>Stream</span><span>Events</span><span>Plays</span><span>Sports</span><span>Activities</span><span
                    class="muted">ListYourShow</span><span class="muted">Corporates</span><span
                    class="muted">Offers</span><span class="muted">Gift Cards</span></div>
        </nav>
    </main>
</body>

</html>
